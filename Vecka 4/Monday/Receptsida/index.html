<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptsida</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <!-- Rubrik -->
         <header>
            <h1>🍽️ Smart Recept- och Kökshjälpare</h1>
         </header>

        <!-- Kontroller -->
         <div class="controls">
            <div class="control-box">
                <h3>Filtrera kategori</h3>
                <p>Visa endast viss mat.</p>
                <select id="filter-category">
                    <option value="all">Alla</option>
                    <option value="vegetarian">Vegetariskt</option>
                    <option value="meat">Kött</option>
                    <option value="fish">Fisk</option>
                </select>
            </div>

            <div class="control-box">
                <h3>Portionsräknare</h3>
                <p>Ändrar antal personer (påverkar pris och mängd)</p>

                <div class="portion-controls">
                    <button id="btn-minus" class="portion-button">-</button>
                    <span id="portion-count" class="portion-count">2</span>st
                    <button id="btn-plus" class="portion-button">+</button>
                </div>
            </div>
         </div>

        <!-- Huvudlayout -->
         <div class="main-layout">
            <!-- Mina recept -->
             <div class="recipe-section">
                <h2>
                <span>Mina Recept</span>
                <span id="recipe-count">0 st</span>
                </h2>

                <!-- Här kommer recept in via JS -->
            <div id="recipe-container" class="recipe-count-badge" class="recipe"></div>

             </div>

            <!-- Formulär till att lägga till -->
             <div class="form-section">
                <h2>✍🏽Lägg till recept</h2>
                <div class="form-card">
                    <form id="add-recipe-form"></form>
                    <div class="form-group">
                        <label>Receptnamn</label>
                        <input type="text" id="input-name" required placeholder="T.ex. Pannkaka" />
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="input-category">
                            <option value="Vegetarian">Vegetariskt</option>
                            <option value="Meat">Kött</option>
                            <option value="Fish">Fisk</option>
                        </select>
                        <div class="form-group">
                            <label>Pris (kr/portion)</label>
                            <input type="text" id="input-price" required placeholder="T.ex. 35" />
                        </div>
                        <div class="form-group">
                            <label>Emoji/Ikon</label>
                            <input type="text" id="input-emoji" required placeholder="T.ex. Pannkakor" />
                        </div>
                        <div class="form-group">
                            <label>Ingredienser</label>
                            <input type="text" id="input-ingredients" required placeholder="T.ex. Mjöl, pasta" />
                        </div>


                    </div>
                </div>

             </div>

            

         </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
