<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slammaster</title>
    <link rel="stylesheet" href="style.css" />
    <link />
  </head>
  <body>
    <main>
      <h1>Räkna ut poäng</h1>
      <p>Ange fem poäng mellan 0.0 och 10.0. OBS: Decimal är punkt!</p>

      <form id="scores">
        <div class="score-input">
          <label for="score-1">Jury 1</label>
          <input id="score-1" />
        </div>
        <div class="score-input">
          <label for="score-2">Jury 2</label>
          <input id="score-2" />
        </div>
        <div class="score-input">
          <label for="score-3">Jury 3</label>
          <input id="score-3" />
        </div>
        <div class="score-input">
          <label for="score-4">Jury 4</label>
          <input id="score-4" />
        </div>
        <div class="score-input">
          <label for="score-5">Jury 5</label>
          <input id="score-5" />
        </div>
      </form>

      <form id="time">
        <div class="time-input">
          <label for="time-minutes">Tid - minuter</label>
          <input id="time-minutes" />
        </div>
        <div class="time-input">
          <label for="time-seconds">Tid - sekunder</label>
          <input id="time-seconds" />
        </div>
      </form>

      <p id="total">Total poäng:</p>
      <p id="time-penalty"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
